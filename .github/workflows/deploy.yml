name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Driftsätt till Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Hoppar över driftsättningen i stället för att fallera om repot saknar token.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN saknas — hoppar över driftsättningen."

      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7

      - if: env.HAS_TOKEN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - if: env.HAS_TOKEN == 'true'
        run: npm ci

      - if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
